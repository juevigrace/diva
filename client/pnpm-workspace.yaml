packages:
  - "packages/web/*"
  - "apps/**/platforms/webApp/*"
  - "**/build/js/packages/*"

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  # page / webApp shared deps
  astro: ^7.0.3
  '@astrojs/node': ^11.0.0
  '@astrojs/react': ^6.0.0
  '@astrojs/sitemap': ^3.7.3
  '@fontsource/inter': ^5.2.8
  react: ^19.2.7
  react-dom: ^19.2.7
  zod: ^4.4.3
  '@tailwindcss/vite': ^4.3.2
  '@astrojs/check': ^0.9.10

  # shared dev/type deps
  typescript: ^6.0.3
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3

  # diva-ui (shadcn) deps
  radix-ui: ^1.6.7
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0

  # root-only tooling
  jiti: ^2.0.0
  '@eslint/js': ^10.0.1
  astro-eslint-parser: ^2.1.0
  eslint: ^10.6.0
  eslint-plugin-astro: ^2.1.1
  prettier: ^3.9.3
  prettier-plugin-astro: ^0.14.1
  prettier-plugin-tailwindcss: ^0.8.0
  turbo: ^2.10.0
  typescript-eslint: ^8.62.0
