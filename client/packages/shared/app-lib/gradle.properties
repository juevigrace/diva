group=io.github.juevigrace
version=1.0.0

# style
kotlin.code.style=official

# performance
org.gradle.jvmargs=-Xmx8g -Xms2g -XX\:+UseG1GC -XX\:+UseStringDeduplication -XX\:MaxMetaspaceSize\=2g -XX\:MaxGCPauseMillis\=200 -XX\:G1HeapRegionSize\=16m -XX\:+UnlockExperimentalVMOptions -Dfile.encoding\=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8g,-Xms512m,-XX\:MaxMetaspaceSize\=2g,-XX\:+UseG1GC,-XX\:+UseStringDeduplication" -Dkotlin.daemon.options\="autoshutdownIdleSeconds\=1800"
kotlin.daemon.jvmargs=-Xms512m -Xmx8g -XX\:+UseG1GC -XX\:+UseStringDeduplication -XX\:MaxMetaspaceSize\=2g -XX\:+HeapDumpOnOutOfMemoryError
kotlin.native.jvmargs=-Xms1g -Xmx4g -XX\:+UseG1GC -XX\:+UseStringDeduplication -XX\:MaxMetaspaceSize\=1g -XX\:+HeapDumpOnOutOfMemoryError

#gradle
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.configuration-cache.problems=warn
org.gradle.dependency.verification=LENIENT
org.gradle.vfs.watch=true

# kotlin
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.stability.nowarn=true
kotlin.incremental.wasm=true
kotlin.mpp.applyDefaultHierarchyTemplate=true
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning
kotlin.daemon.useFallbackStrategy=false
kotlin.js.yarn=false
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

# android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
