# style
kotlin.code.style=official

# performance
org.gradle.jvmargs=-Xmx3g -Xms1g -XX\:+UseG1GC -XX\:+UseStringDeduplication -XX\:MaxMetaspaceSize\=1g -XX\:MaxGCPauseMillis\=200 -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8 -Dkotlin.daemon.options\="autoshutdownIdleSeconds\=1800"
kotlin.daemon.jvmargs=-Xms512m -Xmx2g -XX\:+UseG1GC -XX\:+UseStringDeduplication -XX\:MaxMetaspaceSize\=1g

#gradle
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache.parallel=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.configuration-cache.problems=warn
org.gradle.dependency.verification=LENIENT
org.gradle.vfs.watch=true

# kotlin
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning
kotlin.daemon.useFallbackStrategy=false
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
