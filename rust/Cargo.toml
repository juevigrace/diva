[workspace]
resolver = "2"
members = ["crates/diva-types", "crates/diva-native", "crates/diva-server", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "=0.32.0"
thiserror = "2"
